AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Member 4 - AWS Infrastructure, Authentication and Security
  for Employee Learning Skill Certification Tracker.

Parameters:
  CertificateBucketName:
    Type: String
    Default: employee-lms-certificates-2026-demo

Resources:

  # =========================================================
  # COGNITO - AUTHENTICATION
  # =========================================================

  LMSUserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: Employee-LMS-UserPool
      UsernameAttributes:
        - email
      AutoVerifiedAttributes:
        - email
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireUppercase: true
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: true
      AccountRecoverySetting:
        RecoveryMechanisms:
          - Name: verified_email
            Priority: 1

  LMSUserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: Employee-LMS-Web-App
      UserPoolId: !Ref LMSUserPool
      GenerateSecret: false
      ExplicitAuthFlows:
        - ALLOW_USER_SRP_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH

  HRAdminGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      GroupName: HRAdmin
      Description: HR administrators with course management access
      Precedence: 1
      UserPoolId: !Ref LMSUserPool

  EmployeeGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      GroupName: Employee
      Description: Employees with access to assigned courses and quizzes
      Precedence: 10
      UserPoolId: !Ref LMSUserPool

  # =========================================================
  # DYNAMODB
  # =========================================================

  CoursesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: LMS-Courses
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: course_id
          AttributeType: S
      KeySchema:
        - AttributeName: course_id
          KeyType: HASH
      SSESpecification:
        SSEEnabled: true

  QuizzesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: LMS-Quizzes
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: course_id
          AttributeType: S
        - AttributeName: question_id
          AttributeType: S
      KeySchema:
        - AttributeName: course_id
          KeyType: HASH
        - AttributeName: question_id
          KeyType: RANGE
      SSESpecification:
        SSEEnabled: true

  AssignmentsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: LMS-Assignments
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: employee_id
          AttributeType: S
        - AttributeName: course_id
          AttributeType: S
      KeySchema:
        - AttributeName: employee_id
          KeyType: HASH
        - AttributeName: course_id
          KeyType: RANGE
      SSESpecification:
        SSEEnabled: true

  CompletionsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: LMS-Completions
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: employee_id
          AttributeType: S
        - AttributeName: course_id
          AttributeType: S
      KeySchema:
        - AttributeName: employee_id
          KeyType: HASH
        - AttributeName: course_id
          KeyType: RANGE
      SSESpecification:
        SSEEnabled: true

  CertificatesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: LMS-Certificates
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: certificate_id
          AttributeType: S
      KeySchema:
        - AttributeName: certificate_id
          KeyType: HASH
      SSESpecification:
        SSEEnabled: true

  # =========================================================
  # PRIVATE CERTIFICATE STORAGE
  # =========================================================

  CertificateBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Ref CertificateBucketName
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256

  # =========================================================
  # IAM - LEAST PRIVILEGE LAMBDA ROLES
  # =========================================================

  CourseLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: LMS-CourseLambda-Role-IaC
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - lambda.amazonaws.com
            Action:
              - sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: LMS-Course-DynamoDB-Policy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:Query
                  - dynamodb:Scan
                Resource:
                  - !GetAtt CoursesTable.Arn
                  - !GetAtt AssignmentsTable.Arn

  QuizLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: LMS-QuizLambda-Role-IaC
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - lambda.amazonaws.com
            Action:
              - sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: LMS-Quiz-DynamoDB-Policy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:Query
                Resource:
                  - !GetAtt QuizzesTable.Arn
                  - !GetAtt CompletionsTable.Arn

  CertificateLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: LMS-CertificateLambda-Role-IaC
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - lambda.amazonaws.com
            Action:
              - sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: LMS-Certificate-Storage-Policy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                Resource:
                  - !GetAtt CertificatesTable.Arn

              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                Resource:
                  - !Sub '${CertificateBucket.Arn}/certificates/*'

  VerificationLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: LMS-VerificationLambda-Role-IaC
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - lambda.amazonaws.com
            Action:
              - sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: LMS-Verification-DynamoDB-Policy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                Resource:
                  - !GetAtt CertificatesTable.Arn

  # =========================================================
  # API GATEWAY
  # =========================================================

  LMSRestApi:
    Type: AWS::ApiGateway::RestApi
    Properties:
      Name: Employee-LMS-API
      Description: REST API for Employee Learning Skill Certification Tracker
      EndpointConfiguration:
        Types:
          - REGIONAL

  CognitoAuthorizer:
    Type: AWS::ApiGateway::Authorizer
    Properties:
      Name: Employee-LMS-Cognito-Authorizer
      Type: COGNITO_USER_POOLS
      RestApiId: !Ref LMSRestApi
      IdentitySource: method.request.header.Authorization
      ProviderARNs:
        - !GetAtt LMSUserPool.Arn

  CoursesResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref LMSRestApi
      ParentId: !GetAtt LMSRestApi.RootResourceId
      PathPart: courses

Outputs:

  UserPoolId:
    Description: Cognito User Pool ID
    Value: !Ref LMSUserPool

  UserPoolClientId:
    Description: Cognito Web App Client ID
    Value: !Ref LMSUserPoolClient

  RestApiId:
    Description: Employee LMS REST API ID
    Value: !Ref LMSRestApi

  CertificateBucket:
    Description: Private certificate storage bucket
    Value: !Ref CertificateBucket
